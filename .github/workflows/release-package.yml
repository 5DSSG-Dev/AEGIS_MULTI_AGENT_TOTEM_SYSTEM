name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only; leave enabled until npm publishing access is configured
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run alpha:check
      - name: Validate publication without uploading
        run: npm publish --dry-run --tag alpha
      - name: Publish public alpha
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'Configure the NPM_TOKEN repository secret before publishing.'
            exit 1
          fi
          npm publish --access public --tag alpha --provenance
